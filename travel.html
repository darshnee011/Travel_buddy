<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Buddy Finder</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f5e9ff);
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: #4338ca;
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            color: #555;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        h2 {
            color: #4338ca;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 12px 0 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        .message {
            margin-top: 15px;
            font-weight: bold;
            text-align: center;
        }

        .traveler {
            background: #f5f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 12px;
            border-left: 4px solid #6366f1;
        }

        .traveler p {
            margin: 6px 0;
            color: #444;
        }

        .empty {
            color: #777;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>Travel Buddy Finder</h1>
        <p>Find and connect with travelers visiting your destination.</p>
    </header>

    <div class="card">

        <h2>Register Your Travel Details</h2>

        <form id="travelForm">

            <label for="travelerId">Traveler ID</label>
            <input type="text" id="travelerId"
                   placeholder="Enter your traveler ID" required>

            <label for="name">Traveler Name</label>
            <input type="text" id="name"
                   placeholder="Enter your name" required>

            <label for="destination">Destination</label>
            <input type="text" id="destination"
                   placeholder="Enter your destination" required>

            <label for="travelDate">Travel Date</label>
            <input type="date" id="travelDate" required>

            <button type="submit">Register Travel</button>

        </form>

        <div class="message" id="message"></div>

    </div>

    <div class="card">

        <h2>Registered Travelers</h2>

        <div id="travelerList">
            <p class="empty">Loading travelers...</p>
        </div>

        <button type="button" onclick="loadTravelers()">
            Refresh Travelers
        </button>

    </div>

</div>

<script>

    const form = document.getElementById("travelForm");
    const message = document.getElementById("message");

    // Register traveler
    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const travelerData = {
            travelerId: document.getElementById("travelerId").value.trim(),
            name: document.getElementById("name").value.trim(),
            destination: document.getElementById("destination").value.trim(),
            travelDate: document.getElementById("travelDate").value
        };

        try {

            const response = await fetch("/travelers", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(travelerData)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "Registration failed");
            }

            message.style.color = "green";
            message.textContent = result.message;

            form.reset();

            loadTravelers();

        } catch (error) {

            message.style.color = "red";
            message.textContent = error.message;

        }

    });

    // Display travelers
    async function loadTravelers() {

        const travelerList = document.getElementById("travelerList");

        try {

            const response = await fetch("/travelers");

            if (!response.ok) {
                throw new Error("Unable to load travelers");
            }

            const travelers = await response.json();

            travelerList.innerHTML = "";

            if (travelers.length === 0) {
                travelerList.innerHTML =
                    '<p class="empty">No travelers registered yet.</p>';
                return;
            }

            travelers.forEach(function(traveler) {

                const card = document.createElement("div");
                card.className = "traveler";

                const details = [
                    ["Traveler ID", traveler.travelerId],
                    ["Name", traveler.name],
                    ["Destination", traveler.destination],
                    ["Travel Date", new Date(traveler.travelDate).toLocaleDateString()]
                ];

                details.forEach(function(detail) {
                    const p = document.createElement("p");
                    const strong = document.createElement("strong");

                    strong.textContent = detail[0] + ": ";
                    p.appendChild(strong);
                    p.appendChild(document.createTextNode(detail[1]));

                    card.appendChild(p);
                });

                travelerList.appendChild(card);

            });

        } catch (error) {

            travelerList.textContent = error.message;

        }

    }

    // Load travelers on page opening
    loadTravelers();

</script>

</body>
</html>
